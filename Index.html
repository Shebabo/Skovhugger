<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Skovhugger Dart</title>
  <style>
    body { font-family: Arial; text-align: center; }
    button { padding: 10px; margin: 5px; }
  </style>
</head>
<body>

<h1>🎯 Skovhugger Dart</h1>

<p>Næste mål: <strong id="target"></strong></p>
<p>Point: <strong id="score">0</strong></p>
<p>Pile tilbage: <strong id="darts">3</strong></p>

<input id="hit" placeholder="Fx 15, D20, T19, B">
<br>
<button onclick="throwDart()">Kast pil</button>
<button onclick="nextTurn()">Ny tur</button>

<script>
const targets = [15,16,"D",17,"T",18,41,19,20,"B"];
let targetIndex = 0;
let score = 0;
let darts = 3;
let hitTargetThisTurn = false;

updateUI();

function throwDart() {
  if (darts === 0) return alert("Ingen pile tilbage");

  const hit = document.getElementById("hit").value.toUpperCase();
  document.getElementById("hit").value = "";
  darts--;

  const current = targets[targetIndex];

  if (
    hit == current ||
    (current === "D" && hit.startsWith("D")) ||
    (current === "T" && hit.startsWith("T"))
  ) {
    let points = calculatePoints(hit);
    score += points;
    targetIndex++;
    hitTargetThisTurn = true;
  }

  updateUI();
}

function calculatePoints(hit) {
  if (hit === "B") return 50;
  if (hit.startsWith("D")) return parseInt(hit.slice(1)) * 2;
  if (hit.startsWith("T")) return parseInt(hit.slice(1)) * 3;
  return parseInt(hit);
}

function nextTurn() {
  if (!hitTargetThisTurn) {
    score = Math.floor(score / 2);
  }
  darts = 3;
  hitTargetThisTurn = false;
  updateUI();
}

function updateUI() {
  document.getElementById("target").innerText =
    targets[targetIndex] ?? "FÆRDIG 🎉";
  document.getElementById("score").innerText = score;
  document.getElementById("darts").innerText = darts;
}
</script>

</body>
</html>
