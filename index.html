<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Skovhugger</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 20px;
  text-align: center;
}
.card {
  background: #1e293b;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}
button, select {
  padding: 12px;
  margin: 6px;
  border-radius: 8px;
  font-size: 16px;
}
.primary { background: #22c55e; color: black; border: none; }
.secondary { background: #38bdf8; color: black; border: none; }
.danger { background: #ef4444; color: white; border: none; }
.player {
  border-bottom: 1px solid #334155;
  padding: 8px 0;
}
.active {
  color: #22c55e;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🎯 Skovhugger</h1>

<div class="card">
  <input id="playerName" placeholder="Spillernavn">
  <button class="primary" onclick="addPlayer()">Tilføj spiller</button>
</div>

<div class="card" id="players"></div>

<div class="card" id="game" style="display:none">
  <h2 id="currentPlayer"></h2>
  <p>Mål: <strong id="target"></strong></p>
  <p>Pile tilbage: <strong id="darts">3</strong></p>

  <div>
    <select id="field">
      ${Array.from({length:20},(_,i)=>`<option>${i+1}</option>`).join("")}
      <option>25</option>
    </select>

    <select id="multiplier">
      <option value="1">Single</option>
      <option value="2">Double</option>
      <option value="3">Triple</option>
    </select>
  </div>

  <button class="secondary" onclick="throwDart()">Kast pil</button>
  <button class="danger" onclick="nextTurn()">Næste tur</button>
</div>

<script>
const targets = [15,16,"D",17,"T",18,41,19,20,"B"];
let players = [];
let currentPlayerIndex = 0;
let darts = 3;
let hitThisTurn = false;

function addPlayer() {
  const name = document.getElementById("playerName").value;
  if (!name) return;
  players.push({ name, score: 0, targetIndex: 0 });
  document.getElementById("playerName").value = "";
  document.getElementById("game").style.display = "block";
  updateUI();
}

function throwDart() {
  if (darts === 0) return;
  darts--;

  const field = parseInt(document.getElementById("field").value);
  const mult = parseInt(document.getElementById("multiplier").value);
  const player = players[currentPlayerIndex];
  const target = targets[player.targetIndex];

  let success = false;
  let points = field * mult;

  if (typeof target === "number" && field === target) success = true;
  if (target === "D" && mult === 2) success = true;
  if (target === "T" && mult === 3) success = true;
  if (target === "B" && field === 25) { success = true; points = 50; }

  if (success) {
    player.score += points;
    hitThisTurn = true;
  }

  updateUI();
}

function nextTurn() {
  const player = players[currentPlayerIndex];
  if (hitThisTurn) {
    player.targetIndex++;
  } else {
    player.score = Math.floor(player.score / 2);
  }

  darts = 3;
  hitThisTurn = false;
  currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
  updateUI();
}

function updateUI() {
  document.getElementById("players").innerHTML =
    players.map((p,i)=>`
      <div class="player ${i===currentPlayerIndex?'active':''}">
        ${p.name}: ${p.score} point
      </div>
    `).join("");

  const player = players[currentPlayerIndex];
  document.getElementById("currentPlayer").innerText = "Tur: " + player.name;
  document.getElementById("target").innerText =
    targets[player.targetIndex] ?? "FÆRDIG 🎉";
  document.getElementById("darts").innerText = darts;
}
</script>

</body>
</html>
