<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Skovhugger</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 20px;
  text-align: center;
}
.card {
  background: #1e293b;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
button, select, input {
  padding: 10px;
  margin: 6px;
  border-radius: 8px;
  font-size: 16px;
  border: none;
}
.primary { background: #22c55e; color: black; }
.secondary { background: #38bdf8; color: black; }
.danger { background: #ef4444; color: white; }
.player {
  padding: 6px 0;
  border-bottom: 1px solid #334155;
}
.active {
  color: #22c55e;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🎯 Skovhugger</h1>

<div class="card">
  <input id="playerName" placeholder="Spillernavn">
  <button class="primary" onclick="addPlayer()">Tilføj spiller</button>
  <button class="danger" onclick="startNewGame()">Nyt spil</button>
</div>

<div class="card" id="players"></div>

<div class="card" id="game" style="display:none">
  <h2 id="currentPlayer"></h2>
  <p>Mål: <strong id="target"></strong></p>
  <p>Pile tilbage: <strong id="darts">3</strong></p>

  <div>
    <select id="field">
      <option value="">Felt</option>
      <script>
        for (let i = 1; i <= 20; i++) {
          document.write(`<option value="${i}">${i}</option>`);
        }
      </script>
      <option value="25">Bull</option>
    </select>

    <select id="multiplier">
      <option value="1">Single</option>
      <option value="2">Double</option>
      <option value="3">Triple</option>
    </select>
  </div>

  <button class="secondary" onclick="throwDart()">Kast pil</button>
  <button class="danger" onclick="nextTurn()">Næste tur</button>
</div>

<script>
const targets = [15, 16, "D", 17, "T", 18, 41, 19, 20, "B"];

let players = [];
let currentPlayerIndex = 0;
let darts = 3;
let hitThisTurn = false;

function addPlayer() {
  const name = document.getElementById("playerName").value.trim();
  if (!name) return;

  players.push({
    name,
    score: 0,
    targetIndex: 0
  });

  document.getElementById("playerName").value = "";
  document.getElementById("game").style.display = "block";
  updateUI();
}

function startNewGame() {
  players.forEach(p => {
    p.score = 0;
    p.targetIndex = 0;
  });
  currentPlayerIndex = 0;
  darts = 3;
  hitThisTurn = false;
  updateUI();
}

function throwDart() {
  if (darts === 0) return;

  const field = parseInt(document.getElementById("field").value);
  const mult = parseInt(document.getElementById("multiplier").value);
  if (!field) return alert("Vælg et felt");

  darts--;

  const player = players[currentPlayerIndex];
  const target = targets[player.targetIndex];

  let success = false;
  let points = field * mult;

  if (typeof target === "number" && field === target) success = true;
  if (target === "D" && mult === 2) success = true;
  if (target === "T" && mult === 3) success = true;
  if (target === "B" && field === 25) {
    success = true;
    points = 50;
  }

  if (success) {
    player.score += points;
    hitThisTurn = true;
  }

  updateUI();
}

function nextTurn() {
  const player = players[currentPlayerIndex];

  if (!hitThisTurn) {
    player.score = Math.floor(player.score / 2);
  }

  player.targetIndex++;
  darts = 3;
  hitThisTurn = false;
  currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
  updateUI();
}

function updateUI() {
  document.getElementById("players").innerHTML =
    players.map((p,i)=>`
      <div class="player ${i===currentPlayerIndex?'active':''}">
        ${p.name}: ${p.score} point
      </div>
    `).join("");

  const player = players[currentPlayerIndex];
  document.getElementById("currentPlayer").innerText = "Tur: " + player.name;
  document.getElementById("target").innerText =
    targets[player.targetIndex] ?? "FÆRDIG 🎉";
  document.getElementById("darts").innerText = darts;
}
</script>

</body>
</html>
