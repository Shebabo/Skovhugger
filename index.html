<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Skovhugger</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 20px;
  text-align: center;
}
.card {
  background: #1e293b;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}
button {
  padding: 12px 16px;
  margin: 6px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}
.primary { background: #22c55e; color: black; }
.secondary { background: #38bdf8; color: black; }
.danger { background: #ef4444; color: white; }
.player {
  border-bottom: 1px solid #334155;
  padding: 8px 0;
}
.active {
  color: #22c55e;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🎯 Skovhugger</h1>

<div class="card">
  <input id="playerName" placeholder="Spillernavn">
  <button class="primary" onclick="addPlayer()">Tilføj spiller</button>
</div>

<div class="card" id="players"></div>

<div class="card" id="game" style="display:none">
  <h2 id="currentPlayer"></h2>
  <p>Næste mål: <strong id="target"></strong></p>
  <p>Pile tilbage: <strong id="darts">3</strong></p>

  <div>
    <button class="secondary" onclick="hit('number')">Tal ramt</button>
    <button class="secondary" onclick="hit('double')">Double</button>
    <button class="secondary" onclick="hit('triple')">Triple</button>
    <button class="secondary" onclick="hit('bull')">Bull</button>
  </div>

  <button class="danger" onclick="nextTurn()">Næste tur</button>
</div>

<script>
const targets = [15,16,"D",17,"T",18,41,19,20,"B"];
let players = [];
let currentPlayerIndex = 0;
let darts = 3;
let hitThisTurn = false;

function addPlayer() {
  const name = document.getElementById("playerName").value;
  if (!name) return;
  players.push({ name, score: 0, targetIndex: 0 });
  document.getElementById("playerName").value = "";
  renderPlayers();
  document.getElementById("game").style.display = "block";
  updateUI();
}

function renderPlayers() {
  document.getElementById("players").innerHTML = players.map((p,i) =>
    `<div class="player ${i===currentPlayerIndex?'active':''}">
      ${p.name}: ${p.score} point
    </div>`
  ).join("");
}

function hit(type) {
  if (darts === 0) return;
  darts--;
  const player = players[currentPlayerIndex];
  const target = targets[player.targetIndex];

  let success = false;
  let points = 0;

  if (type === "bull" && target === "B") { success = true; points = 50; }
  if (type === "double" && target === "D") { success = true; points = 40; }
  if (type === "triple" && target === "T") { success = true; points = 60; }
  if (type === "number" && typeof target === "number") { success = true; points = target; }

  if (success) {
    player.score += points;
    player.targetIndex++;
    hitThisTurn = true;
  }

  updateUI();
}

function nextTurn() {
  const player = players[currentPlayerIndex];
  if (!hitThisTurn) {
    player.score = Math.floor(player.score / 2);
  }
  darts = 3;
  hitThisTurn = false;
  currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
  updateUI();
}

function updateUI() {
  renderPlayers();
  const player = players[currentPlayerIndex];
  document.getElementById("currentPlayer").innerText = "Tur: " + player.name;
  document.getElementById("target").innerText =
    targets[player.targetIndex] ?? "FÆRDIG 🎉";
  document.getElementById("darts").innerText = darts;
}
</script>

</body>
</html>
