<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Skovhugger</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');

body{
  margin:0;
  padding:20px;
  background:#020617;
  color:#e5e7eb;
  font-family:system-ui,sans-serif;
  text-align:center;
}

.logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:56px;
  letter-spacing:4px;
  color:#22c55e;
  margin-bottom:20px;
}

.card{
  background:#0f172a;
  padding:18px;
  border-radius:14px;
  margin-bottom:16px;
}

input,select,button{
  padding:14px;
  font-size:16px;
  border-radius:10px;
  border:none;
  margin:6px;
}

input,select{
  background:#020617;
  color:white;
  border:1px solid #1e293b;
}

button{
  background:#1e293b;
  color:white;
}

.primary{ background:#22c55e; color:black; }
.secondary{ background:#38bdf8; color:black; }
.danger{ background:#ef4444; }

.player{
  padding:6px 0;
  border-bottom:1px solid #1e293b;
  color:#94a3b8;
}
.player.active{
  color:#22c55e;
  font-weight:bold;
}

#winnerScreen{ display:none; }
</style>
</head>

<body>

<div class="logo">SKOVHUGGER</div>

<div class="card">
  <input id="playerName" placeholder="Spillernavn">
  <br>
  <button class="primary" onclick="addPlayer()">Tilføj spiller</button>
  <button class="danger" onclick="startNewGame()">Nyt spil</button>
</div>

<div class="card" id="players"></div>

<div class="card" id="game" style="display:none">
  <h2 id="currentPlayer"></h2>
  <p>Mål: <strong id="target"></strong></p>
  <p>Pile tilbage: <strong id="darts"></strong></p>

  <div id="controls"></div>

  <button class="secondary" onclick="undo()">↩️ Fortryd pil</button><br>
  <button class="danger" onclick="nextTurn()">Næste tur</button>
</div>

<div class="card" id="winnerScreen">
  <h2>🏆 Resultat</h2>
  <div id="results"></div>
  <button class="primary" onclick="startNewGame()">Spil igen</button>
</div>

<script>
const targets=[15,16,"D",17,"T",18,41,19,20,"B"];

let players=[],current=0,darts=3,hit=false,history=[];

const playersDiv=document.getElementById("players");
const game=document.getElementById("game");
const winnerScreen=document.getElementById("winnerScreen");
const resultsDiv=document.getElementById("results");
const playerName=document.getElementById("playerName");
const currentPlayer=document.getElementById("currentPlayer");
const targetEl=document.getElementById("target");
const dartsEl=document.getElementById("darts");
const controls=document.getElementById("controls");

function addPlayer(){
  const n=playerName.value.trim();
  if(!n)return;
  players.push({name:n,score:0,target:0});
  playerName.value="";
  game.style.display="block";
  update();
}

function startNewGame(){
  players.forEach(p=>{p.score=0;p.target=0});
  current=0;darts=3;hit=false;history=[];
  winnerScreen.style.display="none";
  game.style.display="block";
  update();
}

function record(points,success){
  if(darts===0)return;
  darts--;
  history.push({points,success});
  if(success){
    players[current].score+=points;
    hit=true;
  }
  update();
}

function miss(){ record(0,false); }

function undo(){
  if(!history.length)return;
  const l=history.pop();
  darts++;
  if(l.success){
    players[current].score-=l.points;
    hit=history.some(h=>h.success);
  }
  update();
}

function nextTurn(){
  if(!hit){
    players[current].score=Math.floor(players[current].score/2);
  }
  players[current].target++;
  current=(current+1)%players.length;
  darts=3;hit=false;history=[];
  update();
}

function update(){
  playersDiv.innerHTML=players.map((p,i)=>
    `<div class="player ${i===current?'active':''}">${p.name}: ${p.score}</div>`
  ).join("");

  if(players.every(p=>p.target>=targets.length)){
    showWinner();
    return;
  }

  const p=players[current],t=targets[p.target];
  currentPlayer.innerText="Tur: "+p.name;
  targetEl.innerText=t;
  dartsEl.innerText=darts;
  controls.innerHTML="";

  if(t===41){
    controls.innerHTML=`
      <button class="primary" onclick="hit41()">41</button>
      <button class="danger" onclick="fail41()">Over / under 41</button>`;
    return;
  }

  if(t==="D"){
    controls.innerHTML=`
      <select id="field">
        <option value="">Vælg felt</option>
        ${[...Array(20)].map((_,i)=>`<option>${i+1}</option>`).join("")}
        <option value="bull">Bull</option>
      </select><br>
      <button class="primary" onclick="doubleHit()">Kast</button>
      <button class="danger" onclick="miss()">Miss</button>`;
    return;
  }

  if(t==="T"){
    controls.innerHTML=`
      <select id="field">
        <option value="">Vælg felt</option>
        ${[...Array(20)].map((_,i)=>`<option>${i+1}</option>`).join("")}
      </select><br>
      <button class="primary" onclick="tripleHit()">Kast</button>
      <button class="danger" onclick="miss()">Miss</button>`;
    return;
  }

  if(t==="B"){
    controls.innerHTML=`
      <button class="primary" onclick="record(25,true)">Single Bull</button>
      <button class="primary" onclick="record(50,true)">Double Bull</button>
      <button class="danger" onclick="miss()">Miss</button>`;
    return;
  }

  if(typeof t==="number"){
    controls.innerHTML=`
      <button onclick="record(${t},true)">Single</button>
      <button onclick="record(${t*2},true)">Double</button>
      <button onclick="record(${t*3},true)">Triple</button>`;
  }
}

function doubleHit(){
  const v=document.getElementById("field").value;
  if(!v)return;
  if(v==="bull") record(50,true);
  else record(parseInt(v)*2,true);
}

function tripleHit(){
  const v=document.getElementById("field").value;
  if(!v)return;
  record(parseInt(v)*3,true);
}

/* 41 – endelig korrekt */
function hit41(){
  players[current].score += 41;
  players[current].target++;
  current = (current + 1) % players.length;
  darts = 3;
  hit = false;
  history = [];
  update();
}

function fail41(){
  players[current].score = Math.floor(players[current].score / 2);
  players[current].target++;
  current = (current + 1) % players.length;
  darts = 3;
  hit = false;
  history = [];
  update();
}

function showWinner(){
  game.style.display="none";
  winnerScreen.style.display="block";
  const sorted=[...players].sort((a,b)=>b.score-a.score);
  resultsDiv.innerHTML=sorted.map((p,i)=>
    `<p>${i===0?'🥇':i===1?'🥈':i===2?'🥉':''} ${p.name}: ${p.score}</p>`
  ).join("");
}
</script>

</body>
</html>
