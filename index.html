<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Skovhugger</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #020617;
  --card: #0f172a;
  --accent: #22c55e;
  --blue: #38bdf8;
  --danger: #ef4444;
  --text: #e5e7eb;
  --muted: #94a3b8;
}

body {
  margin: 0;
  padding: 20px;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: radial-gradient(circle at top, #020617, #000);
  color: var(--text);
  text-align: center;
}

h1 {
  margin-bottom: 10px;
  letter-spacing: 1px;
}

.card {
  background: linear-gradient(180deg, #0f172a, #020617);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}

button, select, input {
  padding: 12px 14px;
  margin: 6px;
  border-radius: 12px;
  font-size: 16px;
  border: none;
}

input, select {
  background: #020617;
  color: var(--text);
  border: 1px solid #1e293b;
}

button {
  cursor: pointer;
  transition: transform .05s ease, opacity .2s;
}
button:active { transform: scale(0.97); }
button:hover { opacity: .9; }

.primary { background: var(--accent); color: black; }
.secondary { background: var(--blue); color: black; }
.danger { background: var(--danger); color: white; }

.player {
  padding: 8px 0;
  border-bottom: 1px solid #1e293b;
  color: var(--muted);
}
.player.active {
  color: var(--accent);
  font-weight: bold;
}

.big {
  font-size: 18px;
  padding: 14px 18px;
}
</style>
</head>

<body>

<h1>🎯 Skovhugger</h1>

<div class="card">
  <input id="playerName" placeholder="Spillernavn">
  <br>
  <button class="primary big" onclick="addPlayer()">Tilføj spiller</button>
  <button class="danger" onclick="startNewGame()">Nyt spil</button>
</div>

<div class="card" id="players"></div>

<div class="card" id="game" style="display:none">
  <h2 id="currentPlayer"></h2>
  <p>Mål: <strong id="target"></strong></p>
  <p>Pile tilbage: <strong id="darts">3</strong></p>

  <div id="controls"></div>

  <button class="secondary" onclick="undo()">↩️ Fortryd seneste pil</button>
  <br>
  <button class="danger" onclick="nextTurn()">Næste tur</button>
</div>

<script>
const targets = [15,16,"D",17,"T",18,41,19,20,"B"];

let players = [];
let currentPlayerIndex = 0;
let darts = 3;
let hitThisTurn = false;
let history = [];

function addPlayer() {
  const name = playerName.value.trim();
  if (!name) return;
  players.push({ name, score: 0, targetIndex: 0 });
  playerName.value = "";
  game.style.display = "block";
  updateUI();
}

function startNewGame() {
  players.forEach(p => { p.score = 0; p.targetIndex = 0; });
  currentPlayerIndex = 0;
  darts = 3;
  hitThisTurn = false;
  history = [];
  updateUI();
}

function throwDart(mult, fieldOverride=null) {
  if (darts === 0) return;

  const player = players[currentPlayerIndex];
  const target = targets[player.targetIndex];
  let success = false;
  let points = 0;

  if (typeof target === "number") {
    success = true;
    points = target * mult;
  }

  if ((target === "D" || target === "T") && fieldOverride > 0) {
    success = true;
    points = fieldOverride * mult;
  }

  if (target === "B") {
    success = true;
    points = 50;
  }

  darts--;
  history.push({ points, success });

  if (success) {
    player.score += points;
    hitThisTurn = true;
  }

  updateUI();
}

function undo() {
  if (!history.length) return;
  const last = history.pop();
  darts++;
  if (last.success) {
    players[currentPlayerIndex].score -= last.points;
    hitThisTurn = history.some(h => h.success);
  }
  updateUI();
}

function nextTurn() {
  const player = players[currentPlayerIndex];
  if (!hitThisTurn) {
    player.score = Math.floor(player.score / 2);
  }
  player.targetIndex++;
  darts = 3;
  hitThisTurn = false;
  history = [];
  currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
  updateUI();
}

function updateUI() {
  playersDiv.innerHTML = players.map((p,i)=>
    `<div class="player ${i===currentPlayerIndex?'active':''}">
      ${p.name}: ${p.score} point
    </div>`).join("");

  const player = players[currentPlayerIndex];
  currentPlayer.innerText = "Tur: " + player.name;
  target.innerText = targets[player.targetIndex] ?? "FÆRDIG 🎉";
  dartsSpan.innerText = darts;

  controls.innerHTML = "";
  const t = targets[player.targetIndex];

  if (typeof t === "number") {
    controls.innerHTML = `
      <button class="secondary big" onclick="throwDart(1)">Single</button>
      <button class="secondary big" onclick="throwDart(2)">Double</button>
      <button class="secondary big" onclick="throwDart(3)">Triple</button>`;
  } else if (t === "D" || t === "T") {
    let opts = `<option value="0">Miss (0)</option>`;
    for (let i=1;i<=20;i++) opts += `<option>${i}</option>`;
    controls.innerHTML = `
      <select id="fieldSelect">${opts}</select>
      <button class="secondary big"
        onclick="throwDart(${t==='D'?2:3}, parseInt(fieldSelect.value))">
        Kast
      </button>`;
  } else if (t === "B") {
    controls.innerHTML =
      `<button class="secondary big" onclick="throwDart(1)">Bull</button>`;
  }
}

const playersDiv = document.getElementById("players");
const game = document.getElementById("game");
const playerName = document.getElementById("playerName");
const currentPlayer = document.getElementById("currentPlayer");
const target = document.getElementById("target");
const dartsSpan = document.getElementById("darts");
const controls = document.getElementById("controls");
</script>

</body>
</html>
