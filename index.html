<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Skovhugger</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');

:root {
  --green: #22c55e;
  --blue: #38bdf8;
  --red: #ef4444;
  --text: #e5e7eb;
  --muted: #94a3b8;
}

body {
  margin: 0;
  padding: 20px;
  font-family: system-ui, sans-serif;
  background: radial-gradient(circle at top, #020617, #000);
  color: var(--text);
  text-align: center;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 64px;
  letter-spacing: 4px;
  background: linear-gradient(180deg, #22c55e, #16a34a);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(34,197,94,.6);
  margin-bottom: 20px;
}

.card {
  background: linear-gradient(180deg, #0f172a, #020617);
  border-radius: 22px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,.8);
}

button, select, input {
  padding: 16px 20px;
  margin: 6px;
  border-radius: 16px;
  font-size: 16px;
  border: none;
}

input, select {
  background: #020617;
  color: var(--text);
  border: 1px solid #1e293b;
}

button {
  cursor: pointer;
  font-weight: bold;
  letter-spacing: .5px;
  transition: transform .06s, box-shadow .2s;
}
button:active { transform: scale(.95); }

.btn-green {
  background: linear-gradient(180deg, #22c55e, #16a34a);
  box-shadow: 0 0 20px rgba(34,197,94,.6);
}
.btn-blue {
  background: linear-gradient(180deg, #38bdf8, #0284c7);
  box-shadow: 0 0 20px rgba(56,189,248,.6);
}
.btn-red {
  background: linear-gradient(180deg, #ef4444, #b91c1c);
  box-shadow: 0 0 20px rgba(239,68,68,.6);
}

.player {
  padding: 10px 0;
  border-bottom: 1px solid #1e293b;
  color: var(--muted);
}
.player.active {
  color: var(--green);
  text-shadow: 0 0 10px rgba(34,197,94,.8);
}

.row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}
</style>
</head>

<body>

<div class="logo">SKOVHUGGER</div>

<div class="card">
  <input id="playerName" placeholder="Spillernavn">
  <br>
  <button class="btn-green" onclick="addPlayer()">Tilføj spiller</button>
  <button class="btn-red" onclick="startNewGame()">Nyt spil</button>
</div>

<div class="card" id="players"></div>

<div class="card" id="game" style="display:none">
  <h2 id="currentPlayer"></h2>
  <p>Mål: <strong id="target"></strong></p>
  <p>Pile tilbage: <strong id="darts">3</strong></p>
  <p id="sum41" style="display:none">Samlet: <strong>0</strong></p>

  <div id="controls"></div>

  <button class="btn-blue" onclick="undo()">↩️ Fortryd pil</button>
  <br>
  <button class="btn-red" onclick="nextTurn()">Næste tur</button>
</div>

<script>
const targets = [15,16,"D",17,"T",18,41,19,20,"B"];
let players=[], currentPlayerIndex=0, darts=3, hitThisTurn=false, history=[], sum41=0;

function addPlayer(){
  const n=playerName.value.trim();
  if(!n)return;
  players.push({name:n,score:0,targetIndex:0});
  playerName.value="";
  game.style.display="block";
  updateUI();
}

function startNewGame(){
  players.forEach(p=>{p.score=0;p.targetIndex=0});
  currentPlayerIndex=0; darts=3; hitThisTurn=false; history=[]; sum41=0;
  updateUI();
}

function throwPoints(points,success){
  if(darts===0)return;
  darts--;
  history.push({points,success});
  if(success){
    players[currentPlayerIndex].score+=points;
    hitThisTurn=true;
  }
  updateUI();
}

function miss(){ throwPoints(0,false); }

function undo(){
  if(!history.length)return;
  const l=history.pop();
  darts++;
  if(l.success){
    players[currentPlayerIndex].score-=l.points;
    hitThisTurn=history.some(h=>h.success);
  }
  if(targets[players[currentPlayerIndex].targetIndex]===41){
    sum41-=l.points;
  }
  updateUI();
}

function nextTurn(){
  const p=players[currentPlayerIndex];
  if(!hitThisTurn)p.score=Math.floor(p.score/2);
  p.targetIndex++; darts=3; hitThisTurn=false; history=[]; sum41=0;
  currentPlayerIndex=(currentPlayerIndex+1)%players.length;
  updateUI();
}

function updateUI(){
  playersDiv.innerHTML=players.map((p,i)=>`<div class="player ${i===currentPlayerIndex?'active':''}">${p.name}: ${p.score}</div>`).join("");
  const p=players[currentPlayerIndex], t=targets[p.targetIndex];
  currentPlayer.innerText="Tur: "+p.name;
  target.innerText=t??"FÆRDIG 🎉";
  dartsSpan.innerText=darts;

  controls.innerHTML="";
  sum41El.style.display="none";

  if(t===41){
    sum41El.style.display="block";
    sum41El.querySelector("strong").innerText=sum41;
    controls.innerHTML=`
      <div class="row">
        <button class="btn-green" onclick="add41(20)">20</button>
        <button class="btn-green" onclick="add41(19)">19</button>
        <button class="btn-green" onclick="add41(18)">18</button>
        <button class="btn-blue" onclick="add41(1)">1</button>
        <button class="btn-red" onclick="miss()">Miss</button>
      </div>`;
    return;
  }

  if(t==="B"){
    controls.innerHTML=`
      <div class="row">
        <button class="btn-green" onclick="throwPoints(25,true)">Single Bull</button>
        <button class="btn-green" onclick="throwPoints(50,true)">Double Bull</button>
        <button class="btn-red" onclick="miss()">Miss</button>
      </div>`;
    return;
  }

  if(typeof t==="number"){
    controls.innerHTML=`
      <div class="row">
        <button class="btn-blue" onclick="throwPoints(t,true)">Single</button>
        <button class="btn-blue" onclick="throwPoints(t*2,true)">Double</button>
        <button class="btn-blue" onclick="throwPoints(t*3,true)">Triple</button>
      </div>`;
  }
}

function add41(v){
  if(darts===0)return;
  darts--;
  sum41+=v;
  history.push({points:v,success:false});
  if(sum41===41){
    players[currentPlayerIndex].score+=41;
    hitThisTurn=true;
  }
  updateUI();
}

const playersDiv=document.getElementById("players");
const game=document.getElementById("game");
const playerName=document.getElementById("playerName");
const currentPlayer=document.getElementById("currentPlayer");
const target=document.getElementById("target");
const dartsSpan=document.getElementById("darts");
const controls=document.getElementById("controls");
const sum41El=document.getElementById("sum41");
</script>

</body>
</html>
