<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Skovhugger</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  padding: 20px;
  text-align: center;
}
.card {
  background: #1e293b;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
button, select, input {
  padding: 10px;
  margin: 6px;
  border-radius: 8px;
  font-size: 16px;
  border: none;
}
.primary { background: #22c55e; color: black; }
.secondary { background: #38bdf8; color: black; }
.danger { background: #ef4444; color: white; }
.player {
  padding: 6px 0;
  border-bottom: 1px solid #334155;
}
.active {
  color: #22c55e;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🎯 Skovhugger</h1>

<div class="card">
  <input id="playerName" placeholder="Spillernavn">
  <button class="primary" onclick="addPlayer()">Tilføj spiller</button>
  <button class="danger" onclick="startNewGame()">Nyt spil</button>
</div>

<div class="card" id="players"></div>

<div class="card" id="game" style="display:none">
  <h2 id="currentPlayer"></h2>
  <p>Mål: <strong id="target"></strong></p>
  <p>Pile tilbage: <strong id="darts">3</strong></p>

  <div id="controls"></div>

  <button class="secondary" onclick="undo()">↩️ Fortryd seneste pil</button>
  <br>
  <button class="danger" onclick="nextTurn()">Næste tur</button>
</div>

<script>
const targets = [15,16,"D",17,"T",18,41,19,20,"B"];

let players = [];
let currentPlayerIndex = 0;
let darts = 3;
let hitThisTurn = false;
let history = [];

function addPlayer() {
  const name = playerName.value.trim();
  if (!name) return;
  players.push({ name, score: 0, targetIndex: 0 });
  playerName.value = "";
  game.style.display = "block";
  updateUI();
}

function startNewGame() {
  players.forEach(p => { p.score = 0; p.targetIndex = 0; });
  currentPlayerIndex = 0;
  darts = 3;
  hitThisTurn = false;
  history = [];
  updateUI();
}

function throwDart(mult, fieldOverride=null) {
  if (darts === 0) return;

  const player = players[currentPlayerIndex];
  const target = targets[player.targetIndex];
  let field = fieldOverride ?? target;
  let points = 0;
  let success = false;

  if (typeof target === "number") {
    success = true;
    points = target * mult;
  }
  if (target === "D" && mult === 2) {
    success = true;
    points = field * 2;
  }
  if (target === "T" && mult === 3) {
    success = true;
    points = field * 3;
  }
  if (target === "B") {
    success = true;
    points = 50;
  }

  darts--;
  history.push({ points, success });

  if (success) {
    player.score += points;
    hitThisTurn = true;
  }

  updateUI();
}

function undo() {
  if (history.length === 0) return;
  const last = history.pop();
  darts++;
  if (last.success) {
    players[currentPlayerIndex].score -= last.points;
    hitThisTurn = history.some(h => h.success);
  }
  updateUI();
}

function nextTurn() {
  if (!hitThisTurn) {
    players[currentPlayerIndex].score =
      Math.floor(players[currentPlayerIndex].score / 2);
  }
  players[currentPlayerIndex].targetIndex++;
  darts = 3;
  hitThisTurn = false;
  history = [];
  currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
  updateUI();
}

function updateUI() {
  playersDiv.innerHTML = players.map((p,i)=>
    `<div class="player ${i===currentPlayerIndex?'active':''}">
      ${p.name}: ${p.score} point
    </div>`).join("");

  const player = players[currentPlayerIndex];
  currentPlayer.innerText = "Tur: " + player.name;
  target.innerText = targets[player.targetIndex] ?? "FÆRDIG 🎉";
  dartsSpan.innerText = darts;

  controls.innerHTML = "";
  const t = targets[player.targetIndex];

  if (typeof t === "number") {
    controls.innerHTML = `
      <button class="secondary" onclick="throwDart(1)">Single</button>
      <button class="secondary" onclick="throwDart(2)">Double</button>
      <button class="secondary" onclick="throwDart(3)">Triple</button>`;
  } else if (t === "D" || t === "T") {
    let opts = "";
    for (let i=1;i<=20;i++) opts += `<option>${i}</option>`;
    controls.innerHTML = `
      <select id="fieldSelect">${opts}</select>
      <button class="secondary"
        onclick="throwDart(${t==='D'?2:3}, parseInt(fieldSelect.value))">
        Kast
      </button>`;
  } else if (t === "B") {
    controls.innerHTML =
      `<button class="secondary" onclick="throwDart(1)">Bull</button>`;
  }
}

const playersDiv = document.getElementById("players");
const game = document.getElementById("game");
const playerName = document.getElementById("playerName");
const currentPlayer = document.getElementById("currentPlayer");
const target = document.getElementById("target");
const dartsSpan = document.getElementById("darts");
const controls = document.getElementById("controls");
</script>

</body>
</html>
