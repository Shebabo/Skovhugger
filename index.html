<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Skovhugger</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');

:root {
  --bg:#020617;
  --card:#0f172a;
  --green:#22c55e;
  --blue:#38bdf8;
  --red:#ef4444;
  --text:#e5e7eb;
  --muted:#94a3b8;
}

body {
  margin:0;
  padding:20px;
  font-family:system-ui,sans-serif;
  background:radial-gradient(circle at top,#020617,#000);
  color:var(--text);
  text-align:center;
}

.logo {
  font-family:'Bebas Neue',sans-serif;
  font-size:56px;
  letter-spacing:4px;
  color:var(--green);
  margin-bottom:20px;
}

.card {
  background:linear-gradient(180deg,#0f172a,#020617);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}

button,select,input {
  padding:14px 16px;
  margin:6px;
  border-radius:12px;
  font-size:16px;
  border:none;
}

input,select {
  background:#020617;
  color:var(--text);
  border:1px solid #1e293b;
}

button {
  cursor:pointer;
  font-weight:600;
  transition:transform .05s,opacity .15s;
}
button:active { transform:scale(.97); }

.green { background:var(--green); color:black; }
.blue { background:var(--blue); color:black; }
.red { background:var(--red); color:white; }

.player {
  padding:8px 0;
  border-bottom:1px solid #1e293b;
  color:var(--muted);
}
.player.active {
  color:var(--green);
  font-weight:bold;
}

.row {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
}
</style>
</head>

<body>

<div class="logo">SKOVHUGGER</div>

<div class="card">
  <input id="playerName" placeholder="Spillernavn">
  <br>
  <button class="green" onclick="addPlayer()">Tilføj spiller</button>
  <button class="red" onclick="startNewGame()">Nyt spil</button>
</div>

<div class="card" id="players"></div>

<div class="card" id="game" style="display:none">
  <h2 id="currentPlayer"></h2>
  <p>Mål: <strong id="target"></strong></p>
  <p>Pile tilbage: <strong id="darts">3</strong></p>
  <p id="sum41" style="display:none">Samlet: <strong>0</strong></p>

  <div id="controls"></div>

  <button class="blue" onclick="undo()">↩️ Fortryd pil</button><br>
  <button class="red" onclick="nextTurn()">Næste tur</button>
</div>

<script>
const targets=[15,16,"D",17,"T",18,41,19,20,"B"];
let players=[],current=0,darts=3,hit=false,history=[],sum41=0;

function addPlayer(){
  const n=playerName.value.trim();
  if(!n)return;
  players.push({name:n,score:0,target:0});
  playerName.value="";
  game.style.display="block";
  update();
}

function startNewGame(){
  players.forEach(p=>{p.score=0;p.target=0});
  current=0;darts=3;hit=false;history=[];sum41=0;
  update();
}

function record(points,success){
  if(darts===0)return;
  darts--;
  history.push({points,success});
  if(success){
    players[current].score+=points;
    hit=true;
  }
  update();
}

function miss(){ record(0,false); }

function undo(){
  if(!history.length)return;
  const l=history.pop();
  darts++;
  if(l.success){
    players[current].score-=l.points;
    hit=history.some(h=>h.success);
  }
  if(targets[players[current].target]===41) sum41-=l.points;
  update();
}

function nextTurn(){
  if(!hit) players[current].score=Math.floor(players[current].score/2);
  players[current].target++;
  current=(current+1)%players.length;
  darts=3;hit=false;history=[];sum41=0;
  update();
}

function update(){
  playersDiv.innerHTML=players.map((p,i)=>
    `<div class="player ${i===current?'active':''}">${p.name}: ${p.score}</div>`
  ).join("");

  const p=players[current],t=targets[p.target];
  currentPlayer.innerText="Tur: "+p.name;
  target.innerText=t??"FÆRDIG 🎉";
  dartsSpan.innerText=darts;

  controls.innerHTML="";
  sum41El.style.display="none";

  if(t===41){
    sum41El.style.display="block";
    sum41El.querySelector("strong").innerText=sum41;
    controls.innerHTML=`
      <div class="row">
        <button class="blue" onclick="add41(20)">20</button>
        <button class="blue" onclick="add41(19)">19</button>
        <button class="blue" onclick="add41(18)">18</button>
        <button class="blue" onclick="add41(1)">1</button>
        <button class="red" onclick="miss()">Miss</button>
      </div>`;
    return;
  }

  if(t==="D"){
    let opts='<option value="">Vælg felt</option>';
    for(let i=1;i<=20;i++)opts+=`<option value="${i}">${i}</option>`;
    opts+=`<option value="bull">Bull</option>`;
    controls.innerHTML=`
      <div class="row">
        <select id="field">${opts}</select>
        <button class="green" onclick="doubleHit()">Kast</button>
        <button class="red" onclick="miss()">Miss</button>
      </div>`;
    return;
  }

  if(t==="T"){
    let opts='<option value="">Vælg felt</option>';
    for(let i=1;i<=20;i++)opts+=`<option value="${i}">${i}</option>`;
    controls.innerHTML=`
      <div class="row">
        <select id="field">${opts}</select>
        <button class="green" onclick="tripleHit()">Kast</button>
        <button class="red" onclick="miss()">Miss</button>
      </div>`;
    return;
  }

  if(t==="B"){
    controls.innerHTML=`
      <div class="row">
        <button class="green" onclick="record(25,true)">Single Bull</button>
        <button class="green" onclick="record(50,true)">Double Bull</button>
        <button class="red" onclick="miss()">Miss</button>
      </div>`;
    return;
  }

  if(typeof t==="number"){
    controls.innerHTML=`
      <div class="row">
        <button class="blue" onclick="record(t,true)">Single</button>
        <button class="blue" onclick="record(t*2,true)">Double</button>
        <button class="blue" onclick="record(t*3,true)">Triple</button>
      </div>`;
  }
}

function doubleHit(){
  const v=document.getElementById("field").value;
  if(!v)return;
  if(v==="bull") record(50,true);
  else record(parseInt(v)*2,true);
}

function tripleHit(){
  const v=document.getElementById("field").value;
  if(!v)return;
  record(parseInt(v)*3,true);
}

function add41(v){
  if(darts===0)return;
  darts--;
  sum41+=v;
  history.push({points:v,success:false});
  if(sum41===41){
    players[current].score+=41;
    hit=true;
  }
  update();
}

const playersDiv=document.getElementById("players");
const game=document.getElementById("game");
const playerName=document.getElementById("playerName");
const currentPlayer=document.getElementById("currentPlayer");
const target=document.getElementById("target");
const dartsSpan=document.getElementById("darts");
const controls=document.getElementById("controls");
const sum41El=document.getElementById("sum41");
</script>

</body>
</html>
